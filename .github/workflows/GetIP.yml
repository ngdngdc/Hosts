# This is a basic workflow to help you get started with Actions
name: Get IP

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  generate-hosts:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Runs a single command using the runners shell
      - name: Set up environment
        run: |
          sudo apt-get update && sudo apt-get install -y dnsutils jq

      # Run the standalone script to generate hosts from Domains.json
      - name: Generate annotated hosts file with both IPv6 and IPv4
        run: |
          chmod +x GetIP.sh
          ./GetIP.sh Domains.json hosts

      - name: Merge hosts with upstream sources
        run: |
          chmod +x MergeHosts.sh
          ./MergeHosts.sh

      - name: Generate lumine config file
        run: |
          chmod +x MergeConfig.sh
          ./MergeConfig.sh hosts_520_Clov

      - name: Commit hosts file to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet --exit-code hosts hosts_520_Clov config_ngdngdc.json; then
            echo "No changes to hosts file"
            exit 0
          fi
          git add hosts hosts_520_Clov config_ngdngdc.json
          git commit -m "Update hosts file - $(date +'%Y-%m-%d %H:%M:%S')"
          git push