# This is a basic workflow to help you get started with Actions
name: Get IP

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  generate-hosts:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Runs a single command using the runners shell
      - name: Set up environment
        run: |
          sudo apt-get update && sudo apt-get install -y dnsutils jq curl
          echo "== Version check =="
          bash --version | head -1
          jq --version
          dig -v | head -1
          curl --version | head -1

      # Run the standalone script to generate hosts from Domains.json
      - name: Generate Domains_Remote.json from remote hosts files
        run: |
          chmod +x FetchRemoteDomains.sh
          ./FetchRemoteDomains.sh Domains_Remote.json

      - name: Generate annotated hosts file with both IPv6 and IPv4
        run: |
          chmod +x BuildHosts.sh
          ./BuildHosts.sh Domains.json Domains_Remote.json hosts_520_Clov

      - name: Generate lumine config file
        run: |
          chmod +x BuildConfig.sh
          ./BuildConfig.sh Domains.json Domains_Remote.json config_default.json config_ngdngdc.json

      - name: Self check
        run: |
          set -euo pipefail
          jq empty Domains_Remote.json && echo "✓ Domains_Remote.json"
          jq empty config_ngdngdc.json && echo "✓ config_ngdngdc.json"
          echo "hosts_520_Clov lines: $(wc -l < hosts_520_Clov)"
          echo "Remote domains: $(jq '[.[] | length] | add' Domains_Remote.json)"
          echo "domain_policies: $(jq '.domain_policies | length' config_ngdngdc.json)"
          test "$(jq '[.[] | length] | add' Domains_Remote.json)" -gt 0

      - name: Commit hosts file to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet --exit-code Domains_Remote.json hosts_520_Clov config_ngdngdc.json; then
            echo "No changes to hosts file"
            exit 0
          fi
          git add Domains_Remote.json hosts_520_Clov config_ngdngdc.json
          git commit -m "Update hosts file - $(date +'%Y-%m-%d %H:%M:%S')"
          git push